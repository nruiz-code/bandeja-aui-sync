name: Sincronizar bandeja AUI

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: bandeja-aui-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Diagnóstico de conectividad
        run: |
          echo "Runner IP:"; curl -sS --max-time 15 https://api.ipify.org || true
          echo ""
          echo -n "SUR https: "; curl -4 -sS -o /dev/null -w "HTTP:%{http_code} tiempo:%{time_total}\n" --max-time 20 https://suraui.sanluis.gov.ar/ || true
          echo -n "SUR http: "; curl -4 -sS -o /dev/null -w "HTTP:%{http_code} tiempo:%{time_total}\n" --max-time 20 http://suraui.sanluis.gov.ar/ || true
          echo -n "SUR https + UA: "; curl -4 -sS -A "Mozilla/5.0" -o /dev/null -w "HTTP:%{http_code} tiempo:%{time_total}\n" --max-time 20 https://suraui.sanluis.gov.ar/ || true
          echo "DNS:"; getent hosts suraui.sanluis.gov.ar || true
          echo -n "Cloudflare API: "; curl -sS -o /dev/null -w "HTTP:%{http_code}\n" --max-time 15 https://api.cloudflare.com/client/v4/user/tokens/verify || true

      - name: Sincronizar con SUR/AUI y Cloudflare
        env:
          SUR_USER: ${{ secrets.SUR_USER }}
          SUR_PASS: ${{ secrets.SUR_PASS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node sync.mjs
